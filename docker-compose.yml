services:
  mf-characters:
    build:
      context: ./MF-Characters
      args:
        PUBLIC_URL: http://localhost:3001/
    container_name: mf-characters
    ports:
      - "3001:80"
    restart: unless-stopped

  mf-character-detail:
    build:
      context: ./MF-CharacterDetail
      args:
        PUBLIC_URL: http://localhost:3002/
    container_name: mf-character-detail
    ports:
      - "3002:80"
    restart: unless-stopped

  mf-shell:
    build:
      context: ./MF-Shell
      args:
        CHARACTERS_URL: http://localhost:3001/remoteEntry.js
        DETAIL_URL: http://localhost:3002/remoteEntry.js
    container_name: mf-shell
    ports:
      - "3000:80"
    depends_on:
      - mf-characters
      - mf-character-detail
    restart: unless-stopped